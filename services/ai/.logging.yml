version: 1
disable_existing_loggers: false

formatters:
  json:
    "()": pythonjsonlogger.jsonlogger.JsonFormatter
    format: "%(asctime)s %(levelname)s %(name)s %(message)s"
    rename_fields: {asctime: ts, levelname: level}

#filters:
#  pii_redact:
#    "()": dispatcher.infra.logging.pii.PiiRedactFilter

handlers:
  stdout:
    class: logging.StreamHandler
    level: INFO
    formatter: json
    filters: [pii_redact]
    stream: ext://sys.stdout

loggers:
  uvicorn:
    level: WARNING
    handlers: [stdout]
    propagate: false
  uvicorn.access:
    level: WARNING
    handlers: [stdout]
    propagate: false

root:
  level: INFO
  handlers: [stdout]
