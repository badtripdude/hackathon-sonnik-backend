services:
  db:
    image: postgres:18.0
    volumes:
      - postgres_data:/var/lib/postgresql/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-dev} -d ${DB_NAME:-store} -p 5432" ]
      interval: 2s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_DB: ${DB_NAME:-store}
      POSTGRES_USER: ${DB_USER:-dev}
      POSTGRES_PASSWORD: ${DB_PASS:-dev}
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    expose:
      - 5432
    command: [ "postgres", "-c", "listen_addresses=*" ]

  ai-migrate:
    build:
      dockerfile: docker/Dockerfile
    command: [ "python", "-m", "alembic", "upgrade", "head" ]
    depends_on:
      db: { condition: service_healthy }
    working_dir: /app
    restart: "no"
    env_file:
      - .env

  ai:
    build:
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    ports:
      - "9090:9090"
    expose:
      - 9090
    command: [ "uvicorn", "ai.main:app", "--host", "0.0.0.0", "--port", "9090", "--app-dir", "src" ]

volumes:
  postgres_data: