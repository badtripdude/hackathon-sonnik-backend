[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai"
version = "0.1.0"
description = "AI service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "elevenlabs>=2.22.1",
    "fastapi>=0.121.2",
    "httpx>=0.28.1",
    "openai>=2.8.0",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
dev = [
]

[tool.hatch.build.targets.wheel]
package-dir = { "" = "src" }
packages = ["ai"]
